<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#171923"><link rel="manifest" href="manifest.webmanifest"><title>MapaForge RPG</title><style>
*{box-sizing:border-box}body{margin:0;background:#11131a;color:#f4f5fa;font:14px system-ui}header,.bar,.panel{padding:9px;background:#1b1f2b;border-bottom:1px solid #394155;display:flex;gap:7px;align-items:center;flex-wrap:wrap}header strong{font-size:18px;margin-right:auto}button,select,input{background:#242a39;color:#fff;border:1px solid #394155;border-radius:8px;padding:9px;font:inherit}button.active{outline:2px solid #70e1b4}button.primary{background:#70e1b4;color:#10251d;font-weight:bold}main{display:flex;flex-direction:column;height:calc(100dvh - 55px)}#stage{flex:1;min-height:170px;touch-action:none;background:#10131a}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}.panel{display:block}.assets{display:flex;overflow-x:auto;gap:6px;min-height:68px}.asset{min-width:56px;height:56px;padding:3px;display:grid;place-items:center}.asset canvas{width:44px;height:44px}.small{color:#aab2c5;font-size:11px}.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}.hidden{display:none}@media(min-width:800px){main{display:grid;grid-template-columns:1fr 330px;grid-template-rows:1fr auto}#stage{grid-row:1/3}.right{overflow:auto;border-left:1px solid #394155}.bar{align-content:start}.panel{border-top:1px solid #394155}}

/* Mobile-first redesign: canvas-first, floating tools, bottom sprite tray */
:root{--bg:#0b0e14;--panel:#171c27;--panel2:#242d3d;--line:#344055;--accent:#8cf0bd;--muted:#a9b6ca}
html,body{width:100%;height:100%;overflow:hidden;background:#0b0e14}
header{height:54px;min-height:54px;padding:0 9px;gap:6px;background:rgba(15,19,28,.97);z-index:30}
header strong{font-size:14px;letter-spacing:.1px}header button{min-width:35px;min-height:36px;padding:6px;border-radius:11px}.top-actions{gap:4px}
main{height:calc(100dvh - 54px);min-height:0;display:block;position:relative}
#stage{position:absolute;inset:0 0 104px 0;min-height:0;background:#0c111a;background-image:radial-gradient(#263247 1px,transparent 1px);background-size:18px 18px}
#cv{touch-action:none}.bar{position:fixed;z-index:25;left:7px;top:50%;transform:translateY(-50%);width:47px;padding:6px;display:flex;flex-direction:column;gap:7px;border:1px solid #3a465b;border-radius:16px;background:rgba(21,27,39,.95);box-shadow:0 8px 28px #0008;backdrop-filter:blur(12px)}
.bar button{width:33px;height:39px;min-height:39px;padding:0;border-radius:10px;font-size:0;display:grid;place-items:center}.bar button::first-letter{font-size:19px}.bar button.active{outline:2px solid var(--accent);background:#263b3a}.bar #grid{font-size:17px}
.panel:not(.assets){display:none}.panel.assets{position:fixed;z-index:24;left:0;right:0;bottom:0;height:104px;padding:8px 9px calc(7px + env(safe-area-inset-bottom));background:rgba(20,25,36,.98);border-top:1px solid #344055;box-shadow:0 -8px 28px #0005;backdrop-filter:blur(14px);overflow:hidden}
.panel.assets .panel-title{margin:0 0 5px;min-height:27px}.panel.assets .panel-title strong{font-size:12px}.panel.assets .row{margin:0;gap:5px}.panel.assets #upload,.panel.assets #assetsout{font-size:10px;padding:5px 7px;min-height:27px}.panel.assets .small{display:none}
#assets{height:57px;min-height:57px;overflow-x:auto;align-items:center;scrollbar-width:none}#assets::-webkit-scrollbar{display:none}.asset{min-width:47px;width:47px;height:47px;border-radius:11px;background:#0d121c;border-color:#36435a}.asset canvas{width:39px;height:39px}
body.settings-open .panel.assets{display:none}body.settings-open .panel:not(.assets){display:block;position:fixed;z-index:40;left:9px;right:9px;bottom:12px;max-height:68dvh;overflow:auto;padding:14px;border:1px solid #3a465b;border-radius:18px;background:rgba(22,28,40,.99);box-shadow:0 15px 50px #000b}body.settings-open .panel:not(.assets) .row{gap:6px}body.settings-open .panel:not(.assets) input,body.settings-open .panel:not(.assets) select{max-width:120px}body.settings-open:after{content:"";position:fixed;inset:54px 0 0;background:#0008;z-index:35}
#mobileSettings,#mobileFull{display:inline-flex}#mobileClose{display:inline-flex}#status{margin-top:8px;line-height:1.4}
@media(min-width:760px){header{height:58px}main{height:calc(100dvh - 58px);display:grid;grid-template-columns:minmax(0,1fr) 330px;grid-template-rows:minmax(0,1fr)}#stage{position:relative;inset:auto;grid-row:1;min-height:0}.right{display:flex;flex-direction:column;overflow:auto;border-left:1px solid var(--line);background:var(--panel)}.bar{position:static;transform:none;width:auto;flex-direction:row;flex-wrap:wrap;border:0;border-radius:0;box-shadow:none;background:var(--panel);backdrop-filter:none}.bar button{width:auto;min-width:42px;padding:8px;font-size:13px}.bar button::first-letter{font-size:inherit}.panel{display:block!important;position:static!important;max-height:none!important;overflow:visible!important;padding:12px;border-top:1px solid var(--line);background:var(--panel);box-shadow:none!important;border-radius:0!important}.panel.assets{height:auto;min-height:0}#assets{height:auto;max-height:210px;flex-wrap:wrap;overflow:auto}.panel.assets .small{display:block}body.settings-open:after{display:none}#mobileSettings,#mobileFull,#mobileClose{display:none}}

</style></head><body><header><strong>🗺️ MapaForge</strong><button id="mobileSettings" title="Configurações">⚙</button><button id="mobileFull" title="Tela cheia">⛶</button><button id="undo">↶</button><button id="redo">↷</button><button id="save" class="primary">Salvar</button></header><main><div id="stage"><canvas id="cv"></canvas></div><div class="right"><div class="bar"><button data-tool="brush" class="active">🖌 Pincel</button><button data-tool="erase">🧽 Borracha</button><button data-tool="fill">🪣 Preencher</button><button data-tool="pick">🧪 Conta-gotas</button><button id="grid" class="active">▦ Grade</button></div><section class="panel"><div class="panel-title"><b>Mapa e configurações</b><button id="mobileClose">Concluir</button></div><div class="row">Largura <input id="mw" type="number" min="8" max="160" value="40" style="width:65px"> Altura <input id="mh" type="number" min="8" max="160" value="40" style="width:65px"><button id="resize">Aplicar</button></div><div class="row">Tile <select id="ts"><option>16</option><option selected>32</option></select> px · Camada <select id="layer"></select><button id="addlayer">＋</button><button id="dellayer">Excluir</button></div><div class="row"><button id="new">Novo mapa</button><button id="png">Exportar PNG</button><button id="json">Exportar JSON</button><button id="import">Importar JSON</button><input id="jsonfile" class="hidden" type="file" accept=".json"></div><div class="row"><label>Nome <input id="name" value="Meu mapa RPG"></label><label><input id="coll" type="checkbox"> Colisões</label></div><div id="status" class="small">Toque para pintar. O mapa é salvo neste aparelho.</div></section><section class="panel assets"><div class="panel-title"><strong>Sprites</strong><div><button id="upload">＋ PNG</button><button id="assetsout">Exportar</button></div></div><div class="row"><input id="imgs" class="hidden" type="file" accept="image/*" multiple></div><div id="assets" class="assets"></div><div class="small">Tiles demonstrativos incluídos. Importe seus PNGs transparentes para usar seus sprites.</div></section></div></main>
<script>
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d');let m,layer=0,tool='brush',selected=0,showGrid=true,showColl=false,imgs=[],hist=[],redoStack=[],drawing=false,last=-1,view={s:1,x:0,y:0};
function uid(){return Math.random().toString(36).slice(2,9)}function layerObj(n){return{name:n,tiles:Array(m.w*m.h).fill(null),coll:Array(m.w*m.h).fill(false),visible:true}}
function gen(name,type){let c=document.createElement('canvas');c.width=c.height=32;let x=c.getContext('2d');x.fillStyle='#426b3c';x.fillRect(0,0,32,32);if(type==='grass'){for(let i=0;i<40;i++){x.fillStyle=i%2?'#59894b':'#83a85a';x.fillRect((i*17)%31,(i*11)%31,2,2)}}if(type==='water'){x.fillStyle='#245b8a';x.fillRect(0,0,32,32);for(let i=0;i<5;i++){x.fillStyle='#3d8ab0';x.fillRect(i*6,5+i*4,7,2)}}if(type==='dirt'||type==='stone'){x.fillStyle=type==='dirt'?'#79513b':'#59616d';x.fillRect(0,0,32,32);x.strokeStyle='#303744';x.strokeRect(1,1,30,30);for(let i=0;i<10;i++){x.fillStyle=type==='dirt'?'#a47750':'#858d99';x.fillRect(i*3%30,i*7%30,3,2)}}if(type==='tree'){x.fillStyle='#62442e';x.fillRect(13,17,7,13);x.fillStyle='#244c32';x.fillRect(4,5,24,18);x.fillStyle='#347344';x.fillRect(7,2,18,20);x.strokeStyle='#172b20';x.strokeRect(4,5,24,18)}if(type==='chest'){x.fillStyle='#704522';x.fillRect(5,12,22,14);x.fillStyle='#c28a3e';x.fillRect(5,10,22,7);x.fillStyle='#f1c96a';x.fillRect(14,14,4,6)}if(type==='mage'){x.fillStyle='#12131b';x.fillRect(11,7,11,19);x.fillRect(9,5,14,6);x.fillStyle='#b32431';x.fillRect(18,9,3,2);x.fillStyle='#d9aa52';x.fillRect(10,15,12,2);x.fillStyle='#a1242e';x.fillRect(25,3,2,21);x.fillStyle='#ef3d48';x.fillRect(23,2,4,4)}return{id:uid(),name,data:c.toDataURL()}}
function init(){m={name:'Meu mapa RPG',w:40,h:40,ts:32,layers:[],assets:['Grama|grass','Água|water','Terra|dirt','Pedra|stone','Árvore|tree','Baú|chest','Mago demo|mage'].map(s=>{let a=s.split('|');return gen(a[0],a[1])})};m.layers=[layerObj('Terreno'),layerObj('Objetos'),layerObj('Personagens')];layer=0;loadImgs();layersUI();assetUI();resize();draw()}
function loadImgs(){imgs=m.assets.map(a=>{let i=new Image();i.src=a.data;return i})}function saveHist(){hist.push(JSON.stringify({m,layer,selected}));if(hist.length>30)hist.shift();redoStack=[];buttons()}
function buttons(){$('undo').disabled=!hist.length;$('redo').disabled=!redoStack.length}function restore(s){let o=JSON.parse(s);m=o.m;layer=o.layer;selected=o.selected;loadImgs();layersUI();assetUI();resize();draw();saveLocal(false)}
function undo(){if(hist.length){redoStack.push(JSON.stringify({m,layer,selected}));restore(hist.pop());buttons()}}function redo(){if(redoStack.length){hist.push(JSON.stringify({m,layer,selected}));restore(redoStack.pop());buttons()}}
function layersUI(){let e=$('layer');e.innerHTML='';m.layers.forEach((l,i)=>{let o=document.createElement('option');o.value=i;o.textContent=l.name;e.append(o)});e.value=layer}
function assetUI(){let root=$('assets');root.innerHTML='';m.assets.forEach((a,i)=>{let b=document.createElement('button');b.className='asset'+(i===selected?' active':'');let c=document.createElement('canvas');c.width=c.height=44;let x=c.getContext('2d');x.fillStyle='#252a35';x.fillRect(0,0,44,44);if(imgs[i]?.complete)x.drawImage(imgs[i],0,0,44,44);b.append(c);b.title=a.name;b.onclick=()=>{selected=i;tool='brush';document.querySelectorAll('[data-tool]').forEach(z=>z.classList.toggle('active',z.dataset.tool==='brush'));assetUI()};root.append(b)})}
function resize(){let r=$('stage').getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);view.s=Math.min((r.width-20)/(m.w*m.ts),(r.height-20)/(m.h*m.ts),1.4);view.x=(r.width-m.w*m.ts*view.s)/2;view.y=(r.height-m.h*m.ts*view.s)/2;draw()}
function draw(){let r=$('stage').getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);ctx.fillStyle='#10131a';ctx.fillRect(0,0,r.width,r.height);ctx.save();ctx.translate(view.x,view.y);ctx.scale(view.s,view.s);ctx.fillStyle='#26342a';ctx.fillRect(0,0,m.w*m.ts,m.h*m.ts);for(let l of m.layers){if(!l.visible)continue;l.tiles.forEach((a,i)=>{if(a==null)return;let im=imgs[a];if(im?.complete){ctx.imageSmoothingEnabled=false;ctx.drawImage(im,i%m.w*m.ts,Math.floor(i/m.w)*m.ts,m.ts,m.ts)}})}if(showColl)m.layers[layer].coll.forEach((v,i)=>{if(v){ctx.fillStyle='#ff334466';ctx.fillRect(i%m.w*m.ts,Math.floor(i/m.w)*m.ts,m.ts,m.ts)}});if(showGrid){ctx.strokeStyle='#dce5ed33';ctx.lineWidth=1/view.s;ctx.beginPath();for(let x=0;x<=m.w;x++){ctx.moveTo(x*m.ts,0);ctx.lineTo(x*m.ts,m.h*m.ts)}for(let y=0;y<=m.h;y++){ctx.moveTo(0,y*m.ts);ctx.lineTo(m.w*m.ts,y*m.ts)}ctx.stroke()}ctx.strokeStyle='#70e1b4';ctx.lineWidth=2/view.s;ctx.strokeRect(0,0,m.w*m.ts,m.h*m.ts);ctx.restore()}
function cell(e){let r=cv.getBoundingClientRect(),x=(e.clientX-r.left-view.x)/view.s,y=(e.clientY-r.top-view.y)/view.s,c=Math.floor(x/m.ts),r0=Math.floor(y/m.ts);return c<0||r0<0||c>=m.w||r0>=m.h?null:{x:c,y:r0,i:r0*m.w+c}}
function paint(c){if(!c)return;let l=m.layers[layer];if(showColl&&tool==='brush'){l.coll[c.i]=!l.coll[c.i];draw();return}if(tool==='pick'){if(l.tiles[c.i]!=null){selected=l.tiles[c.i];assetUI()}return}if(tool==='erase'){l.tiles[c.i]=null;l.coll[c.i]=false}else if(tool==='brush')l.tiles[c.i]=selected;else if(tool==='fill'){let old=l.tiles[c.i],st=[c.i],seen=new Set();while(st.length){let i=st.pop();if(seen.has(i)||l.tiles[i]!==old)continue;seen.add(i);l.tiles[i]=selected;let x=i%m.w,y=Math.floor(i/m.w);if(x)st.push(i-1);if(x<m.w-1)st.push(i+1);if(y)st.push(i-m.w);if(y<m.h-1)st.push(i+m.w)}}draw()}
cv.onpointerdown=e=>{e.preventDefault();let c=cell(e);if(!c)return;saveHist();drawing=true;last=-1;cv.setPointerCapture(e.pointerId);paint(c);last=c.i};cv.onpointermove=e=>{if(!drawing)return;let c=cell(e);if(c&&c.i!==last){paint(c);last=c.i}};cv.onpointerup=cv.onpointercancel=()=>{drawing=false;saveLocal(false)};
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(z=>z.classList.toggle('active',z===b))});
$('grid').onclick=()=>{showGrid=!showGrid;$('grid').classList.toggle('active',showGrid);draw()};$('coll').onchange=e=>{showColl=e.target.checked;draw()};$('ts').onchange=e=>{m.ts=+e.target.value;resize()};$('layer').onchange=e=>layer=+e.target.value;
$('addlayer').onclick=()=>{if(m.layers.length>=8)return status('Máximo de 8 camadas.');saveHist();m.layers.push(layerObj('Camada '+(m.layers.length+1)));layer=m.layers.length-1;layersUI();draw()};
$('dellayer').onclick=()=>{if(m.layers.length<2)return status('Mantenha ao menos uma camada.');if(confirm('Excluir camada atual?')){saveHist();m.layers.splice(layer,1);layer=Math.max(0,layer-1);layersUI();draw()}};
$('resize').onclick=()=>{let w=Math.max(8,Math.min(160,+$('mw').value||40)),h=Math.max(8,Math.min(160,+$('mh').value||40));saveHist();m.layers.forEach(l=>{let old=l.tiles,co=l.coll,ow=m.w,oh=m.h;l.tiles=Array(w*h).fill(null);l.coll=Array(w*h).fill(false);for(let y=0;y<Math.min(oh,h);y++)for(let x=0;x<Math.min(ow,w);x++){l.tiles[y*w+x]=old[y*ow+x];l.coll[y*w+x]=co[y*ow+x]}});m.w=w;m.h=h;resize();status('Tamanho atualizado.')};
$('name').onchange=e=>m.name=e.target.value;function status(s){$('status').textContent=s}function project(){m.name=$('name').value||m.name;return {format:'MapaForge RPG',version:1,map:m}}function saveLocal(show){try{localStorage.setItem('mapaforge',JSON.stringify(project()));if(show)status('Salvo neste aparelho.')}catch(e){status('Armazenamento cheio; exporte JSON.')}}$('save').onclick=()=>saveLocal(true);
function download(name,blob){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
$('json').onclick=()=>download('mapa-rpg.json',new Blob([JSON.stringify(project())],{type:'application/json'}));$('import').onclick=()=>$('jsonfile').click();$('jsonfile').onchange=async e=>{try{let o=JSON.parse(await e.target.files[0].text()),n=o.map||o;if(!n.layers||!n.assets)throw 0;saveHist();m=n;layer=0;selected=0;$('name').value=m.name;loadImgs();layersUI();assetUI();resize();saveLocal(false);status('Projeto importado.')}catch{alert('Arquivo JSON inválido.')}e.target.value=''};
$('new').onclick=()=>{if(!confirm('Criar novo mapa?'))return;saveHist();let w=m.w,h=m.h,ts=m.ts;m={name:'Novo mapa',w,h,ts,layers:[],assets:m.assets};m.layers=[layerObj('Terreno'),layerObj('Objetos'),layerObj('Personagens')];layer=selected=0;$('name').value=m.name;layersUI();draw();saveLocal(false)};
$('png').onclick=()=>{let o=document.createElement('canvas');o.width=m.w*m.ts;o.height=m.h*m.ts;let x=o.getContext('2d');x.fillStyle='#26342a';x.fillRect(0,0,o.width,o.height);m.layers.forEach(l=>l.tiles.forEach((a,i)=>{if(a!=null&&imgs[a]?.complete)x.drawImage(imgs[a],i%m.w*m.ts,Math.floor(i/m.w)*m.ts,m.ts,m.ts)}));o.toBlob(b=>download('mapa-rpg.png',b))};
$('upload').onclick=()=>$('imgs').click();$('imgs').onchange=async e=>{for(let f of e.target.files){if(m.assets.length>=150)break;let data=await new Promise(res=>{let r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)});let im=new Image();im.src=data;await im.decode();saveHist();m.assets.push({id:uid(),name:f.name.replace(/\.[^.]+$/,'').slice(0,22),data});loadImgs()}selected=m.assets.length-1;assetUI();draw();status('Sprites importados.');e.target.value=''};
$('assetsout').onclick=()=>download('biblioteca-sprites.json',new Blob([JSON.stringify({assets:m.assets})],{type:'application/json'}));$('undo').onclick=undo;$('redo').onclick=redo;window.onresize=resize;
if('serviceWorker'in navigator&&location.protocol!=='file:')addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
init();try{let o=JSON.parse(localStorage.getItem('mapaforge')||'null');if(o?.map){m=o.map;layer=0;selected=0;$('name').value=m.name;loadImgs();layersUI();assetUI();resize();status('Projeto anterior recuperado.')}}catch{}

// Mobile controls: settings drawer and fullscreen request
const settingsBtn=document.getElementById('mobileSettings');const closeBtn=document.getElementById('mobileClose');if(settingsBtn)settingsBtn.addEventListener('click',()=>document.body.classList.toggle('settings-open'));if(closeBtn)closeBtn.addEventListener('click',()=>document.body.classList.remove('settings-open'));document.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('settings-open')});const fullBtn=document.getElementById('mobileFull');if(fullBtn)fullBtn.addEventListener('click',async()=>{try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen?.();fullBtn.textContent='⤢'}else{await document.exitFullscreen?.();fullBtn.textContent='⛶'}}catch(e){status('Use o menu do navegador para ativar tela cheia.')}});
</script></body></html>
