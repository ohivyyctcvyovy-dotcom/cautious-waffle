name: Build APK 455

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK and platform
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK signature, alignment, package and supported ABIs
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/455-badging.txt
          grep -q "package: name='com.leitordetela.app.v6' versionCode='6' versionName='1.2.2'" /tmp/455-badging.txt
          grep -q "launchable-activity: name='com.leitordetela.app.MainActivity'" /tmp/455-badging.txt
          grep -q "sdkVersion:'30'" /tmp/455-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" > /tmp/455-permissions.txt
          ! grep -q 'BIND_ACCESSIBILITY_SERVICE' /tmp/455-permissions.txt
          ! grep -q 'canTakeScreenshot="true"' app/src/main/res/xml/accessibility_service_config.xml || exit 1
          grep -q 'FOREGROUND_SERVICE_MEDIA_PROJECTION' /tmp/455-permissions.txt
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/'
          unzip -Z1 "$APK" | grep -q '^lib/armeabi-v7a/'
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 455-apk-mediaprojection-v1.2.2
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
