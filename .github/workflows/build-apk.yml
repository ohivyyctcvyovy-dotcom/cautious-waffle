name: Build APK 455
on:
  workflow_dispatch:
  push:
    paths:
      - '455-Android-Studio.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Descompactar projeto
        run: |
          test -f 455-Android-Studio.zip
          mkdir -p source
          unzip -o 455-Android-Studio.zip -d source
          find source -name gradlew -type f -exec chmod +x {} \;
      - name: Compilar APK
        run: |
          cd source/TelaLeitor
          gradle --version
          gradle assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: 455-apk
          path: source/TelaLeitor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
